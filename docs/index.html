<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#040922">
<meta name="color-scheme" content="dark">
<title>GiftRush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Manrope:wght@600;700;800&family=Rubik:wght@800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<div id="splash"><video id="sv" src="intro.mp4" poster="intro.jpg" muted playsinline webkit-playsinline preload="auto" autoplay></video></div>
<div id="app">
  <header id="top">
    <div class="brand">🎁 GiftRush</div>
    <div class="balance"><i class="rc"></i><b id="bal">0</b></div>
  </header>
  <div id="ticker"><div class="track" id="tickerTrack"></div></div>
  <main id="view"></main>
  <nav id="nav">
    <button data-tab="tasks"><i>✅</i>Задания</button>
    <button data-tab="tour"><i>🌍</i>Турнир</button>
    <button data-tab="games" class="on"><i>🎮</i>Игры</button>
    <button data-tab="contests"><i>🏆</i>Конкурсы</button>
    <button data-tab="profile"><i>👤</i>Профиль</button>
  </nav>
</div>
<div id="toast"></div>
<script src="app.js?v=11"></script>
<script>
(function(){var s=document.getElementById('splash'),v=document.getElementById('sv'),d=false;
function hide(){if(d)return;d=true;s.classList.add('out');setTimeout(function(){s.remove()},800)}
try{var p=v.play();if(p&&p.catch)p.catch(function(){})}catch(e){}
v.addEventListener('ended',hide);v.addEventListener('error',function(){setTimeout(hide,1200)});
setTimeout(hide,2400);})();
</script>
</body>
</html>
