<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#040922">
<meta name="color-scheme" content="dark">
<title>GiftRush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@600;700;800&family=Rubik:wght@800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css?v=71">
</head>
<body>
<div id="splash"><video id="sv" src="intro.mp4" poster="intro.jpg" muted playsinline webkit-playsinline preload="auto" autoplay></video></div>
<div id="app">
  <header id="top">
    <div class="brand"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#4d8dff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>GiftRush</div>
    <div class="balance"><i class="rc"></i><b id="bal">0</b></div>
  </header>
  <main id="view"></main>
  <nav id="nav">
    <button data-tab="tasks"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></i>Задания</button>
    <button data-tab="tour"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></svg></i>Лидерборд</button>
    <button data-tab="games" class="on"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="11" rx="5"/><path d="M8 10v5M5.5 12.5h5"/><circle cx="15.5" cy="11.5" r=".8" fill="currentColor"/><circle cx="18" cy="13.5" r=".8" fill="currentColor"/></svg></i>Игры</button>
    <button data-tab="market"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg></i>Маркет</button>
    <button data-tab="profile"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1-4 4-5.5 7.5-5.5s6.5 1.5 7.5 5.5"/></svg></i>Профиль</button>
  </nav>
</div>
<div id="toast"></div>
<script src="app.js?v=71"></script>
<script>
(function(){var s=document.getElementById('splash'),v=document.getElementById('sv'),d=false;
function hide(){if(d)return;d=true;s.classList.add('out');setTimeout(function(){s.remove()},800)}
try{var p=v.play();if(p&&p.catch)p.catch(function(){})}catch(e){}
v.addEventListener('ended',hide);v.addEventListener('error',function(){setTimeout(hide,1200)});
setTimeout(hide,2400);})();
</script>
</body>
</html>
